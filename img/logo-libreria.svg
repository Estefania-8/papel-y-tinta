<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="100%" height="100%">
  <!-- FONDO BLANCO SÓLIDO -->
  <rect width="100%" height="100%" fill="#FFFFFF" rx="8" />

  <defs>
    <!-- Estilos tipográficos y colores integrados -->
    <style>
      .estilo-texto-papel {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 38px;
        font-weight: 700;
        fill: #2C3E50;
      }
      .estilo-ampersand {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 42px;
        font-weight: 400;
        font-style: italic;
        fill: #8A4F7D; /* Morado original */
      }
      .estilo-subtitulo {
        font-family: 'Montserrat', sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 8px;
        fill: #7F8C8D;
        text-anchor: middle;
      }
      .estilo-icono {
        fill: none;
        stroke: #8A4F7D; /* Morado original */
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .estilo-pluma {
        fill: #2C3E50;
      }
    </style>
  </defs>

  <!-- ISOTIPO: Libro abierto con pluma de tinta -->
  <g transform="translate(15, 20)">
    <!-- Páginas del libro -->
    <path class="estilo-icono" d="M 20 65 Q 45 55 70 65 L 70 25 Q 45 15 20 25 Z" />
    <path class="estilo-icono" d="M 70 65 Q 95 55 120 65 L 120 25 Q 95 15 70 25 Z" />
    <!-- Líneas de texto simulación -->
    <line x1="30" y1="35" x2="60" y2="31" stroke="#BDC3C7" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="45" x2="55" y2="41" stroke="#BDC3C7" stroke-width="2" stroke-linecap="round"/>
    <line x1="80" y1="31" x2="110" y2="35" stroke="#BDC3C7" stroke-width="2" stroke-linecap="round"/>
    <line x1="85" y1="41" x2="110" y2="45" stroke="#BDC3C7" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Pluma estilográfica integrada -->
    <path class="estilo-pluma" d="M 95 10 C 80 25 70 40 68 52 C 67 58 72 60 76 57 C 82 52 92 38 105 20 C 107 17 101 8 95 10 Z" />
    <circle cx="73" cy="53" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- LOGOTIPO: Nombre de la librería -->
  <text x="155" y="63" class="estilo-texto-papel">PAPEL <tspan class="estilo-ampersand">&amp;</tspan> TINTA</text>
  
  <!-- SUBTÍTULO: Centrado respecto al nombre -->
  <text x="298" y="86" class="estilo-subtitulo">LIBRERÍA</text>
  
  <!-- Línea decorativa morada -->
  <line x1="155" y1="97" x2="442" y2="97" stroke="#8A4F7D" stroke-width="2.5" stroke-linecap="round"/>
</svg>
